services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # KC_HOSTNAME=localhost makes Keycloak always report its issuer/URLs as
  # http://localhost:8080, matching what the browser (and thus every issued
  # token's `iss` claim) sees, even though the Api reaches Keycloak inside
  # the compose network via the "keycloak" service name.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Database=meridian;Username=postgres;Password=postgres"
      Keycloak__Authority: "http://keycloak:8080/realms/meridian"
      Keycloak__Audience: "meridian-api"
    ports:
      - "5299:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:5299
        VITE_KEYCLOAK_AUTHORITY: http://localhost:8080/realms/meridian
        VITE_KEYCLOAK_CLIENT_ID: meridian-web
    ports:
      - "4173:4173"
    depends_on:
      - api

volumes:
  postgres-data:
