name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet-test:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MeridianPlatform.slnx

      - name: Build
        run: dotnet build MeridianPlatform.slnx --no-restore --configuration Release

      # Testcontainers needs Docker, which is preinstalled on ubuntu-latest runners.
      - name: Test
        run: dotnet test MeridianPlatform.slnx --no-build --configuration Release

  web-test:
    name: Frontend (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
